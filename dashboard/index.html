<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Battery Fleet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="map.css">
</head>
<body>
  <header class="top-bar">
    <h1>Battery Fleet</h1>
    <label class="run-picker">
      Run
      <select id="run-select"><option value="">Loading…</option></select>
    </label>
  </header>

  <div id="error-banner" class="error-banner hidden"></div>
  <div id="loading-banner" class="loading-banner hidden">Loading run…</div>

  <section class="metrics" id="metrics">
    <div class="metric"><span class="label">Revenue</span><span class="value" id="m-revenue">—</span></div>
    <div class="metric"><span class="label">Shortfall</span><span class="value" id="m-shortfall">—</span></div>
    <div class="metric"><span class="label">Coverage</span><span class="value" id="m-coverage">—</span></div>
    <div class="metric"><span class="label">Locations dark</span><span class="value" id="m-dark">—</span></div>
    <div class="metric"><span class="label">Time at floor</span><span class="value" id="m-floor">—</span></div>
  </section>

  <main class="grid">
    <section class="panel map-panel">
      <h2>Fleet map</h2>
      <div class="map-wrap">
        <div id="fleet-map"></div>
        <div id="map-caption"></div>
        <aside id="map-legend" aria-label="Map legend">
          <div class="legend-modes" role="group" aria-label="Color by">
            <button type="button" id="color-soc" class="on">SOC</button>
            <button type="button" id="color-demand">Demand</button>
          </div>
          <div class="legend-ramp">
            <span id="legend-lo">0%</span>
            <div id="legend-bar" class="soc"></div>
            <span id="legend-hi">100%</span>
          </div>
          <ul class="legend-flags">
            <li><i class="islanded"></i> islanded</li>
            <li><i class="silent"></i> silent</li>
          </ul>
        </aside>
      </div>
      <div class="scrubber">
        <button type="button" id="btn-restart" class="ctrl" title="Restart">⏮</button>
        <button type="button" id="btn-play" class="ctrl" aria-pressed="false">Play</button>
        <input type="range" id="time-slider" min="0" max="3600" value="0" step="15">
        <span id="time-label">00:00</span>
        <label class="speed">
          <select id="speed-select">
            <option value="60">60×</option>
            <option value="300">300×</option>
            <option value="1200">1200×</option>
            <option value="3600" selected>3600×</option>
            <option value="14400">4h/s</option>
            <option value="28800">8h/s</option>
          </select>
        </label>
      </div>
    </section>

    <section class="panel charts-panel">
      <h2>SPP <small id="spp-legend"></small></h2>
      <div class="canvas-wrap"><canvas id="chart-spp" width="800" height="140"></canvas></div>
      <h2>Fleet mean SOC</h2>
      <div class="canvas-wrap"><canvas id="chart-soc" width="800" height="120"></canvas></div>
      <h2>Shortfall</h2>
      <div class="canvas-wrap"><canvas id="chart-shortfall" width="800" height="120"></canvas></div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="charts.js"></script>
  <script src="map.js"></script>
  <script src="playback.js"></script>
  <script src="app.js"></script>
</body>
</html>
